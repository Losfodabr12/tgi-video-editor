name: Windows editor
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - uses: actions/cache@v6.1.0
        with:
          path: |
            source/tools/ffmpeg
            source/tools/whisper
          key: windows-media-tools-ffmpeg-8.1.2-whisper-b5454-base-v2
      - name: Install local runtimes
        run: ./tool/setup_tools.ps1
      - name: Pub get, analyze, tests and release build
        run: ./tool/test_editor.ps1 -Integration -Build
      - name: Inspect working tree after build
        if: always()
        run: |
          git status --porcelain
          git diff --stat
      - name: Record executed remote checks
        run: ./tool/write_ci_report.ps1 -OutputPath .work/ci-RELATORIO_ALTERACOES.md
      - name: Package offline Windows build
        run: ./tool/package_windows.ps1 -ReportPath .work/ci-RELATORIO_ALTERACOES.md
      - name: Upload Windows build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frame-studio-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/RELATORIO_ALTERACOES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload golden differences on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golden-differences
          path: source/test/failures
          if-no-files-found: ignore
          retention-days: 7
