name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frame-studio-windows-x64
          path: dist
      - name: Publish tagged Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          $notesPath = 'docs/RELEASE_' + $env:GITHUB_REF_NAME.Substring(1) + '.md'
          $notesArguments = if (Test-Path -LiteralPath $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title ('Frame Studio ' + $env:GITHUB_REF_NAME) @notesArguments
          if ($LASTEXITCODE -ne 0) { throw 'Publicacao da release falhou.' }
